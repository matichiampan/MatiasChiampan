<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#b7b6b7"/>
  <style>text { font-family: 'DejaVu Sans', Arial, sans-serif; }</style>
  <text x="72" y="75" font-size="22" font-weight="700" letter-spacing="2">EL EFECTO DE SER VÍCTIMA</text>
  <text x="1008" y="75" font-size="20" font-weight="700" text-anchor="end">4/6</text>
  <line x1="72" y1="102" x2="1008" y2="102" stroke="#111" stroke-width="2"/>
<text x="72" y="220" font-size="64" font-weight="800" fill="#111111" text-anchor="start" font-style="normal">DESPUÉS DE UN HECHO,</text>
<text x="72" y="287" font-size="64" font-weight="800" fill="#111111" text-anchor="start" font-style="normal">LA PERCEPCIÓN CAMBIA</text><text x="72" y="560" font-size="176" font-weight="800" fill="#d92f35" text-anchor="start" font-style="normal">72%</text><text x="82" y="650" font-size="38" font-weight="700" fill="#111111" text-anchor="start" font-style="normal">de las víctimas se siente</text>
<text x="82" y="695" font-size="38" font-weight="700" fill="#111111" text-anchor="start" font-style="normal">poco o nada segura.</text><rect x="72" y="810" width="936" height="204" rx="20" fill="#ffffff" fill-opacity=".78"/><text x="112" y="900" font-size="64" font-weight="800" fill="#111111" text-anchor="start" font-style="normal">33 PUNTOS</text><text x="112" y="952" font-size="24" font-weight="500" fill="#111111" text-anchor="start" font-style="normal">Es la brecha frente a quienes no fueron víctimas:</text>
<text x="112" y="983" font-size="24" font-weight="500" fill="#111111" text-anchor="start" font-style="normal">entre ellas, la inseguridad baja al 39%.</text><text x="72" y="1135" font-size="27" font-weight="600" fill="#111111" text-anchor="start" font-style="normal">La experiencia personal transforma el miedo.</text>  <g transform="translate(72 1262)">
    <circle cx="7" cy="-7" r="7" fill="#ff6b2c"/><circle cx="24" cy="-7" r="7" fill="#ff6b2c"/><circle cx="15.5" cy="-22" r="7" fill="#ff6b2c"/>
    <text x="42" y="0" font-size="26" font-weight="800">afiches</text>
  </g>
</svg>